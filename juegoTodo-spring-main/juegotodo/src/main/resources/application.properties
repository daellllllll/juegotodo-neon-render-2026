# Lee variables locales desde .env. En Render se configuran en Environment.
spring.config.import=optional:file:.env[.properties],optional:file:juegotodo/.env[.properties]

# Conexión a PostgreSQL en Neon
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Hibernate / JPA (crea y actualiza las tablas en Neon automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Puerto y orígenes CORS permitidos para el frontend
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Configuración JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
auth.refresh-cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:false}
auth.refresh-cookie-same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
