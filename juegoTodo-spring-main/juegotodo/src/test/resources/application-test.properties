spring.datasource.url=jdbc:h2:mem:juegotodo-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
jwt.secret=integration-test-only-secret-with-more-than-32-bytes
jwt.expiration=900000
jwt.refresh-expiration=604800000
app.cors.allowed-origins=http://localhost:5173
auth.refresh-cookie-secure=false
auth.refresh-cookie-same-site=Lax
